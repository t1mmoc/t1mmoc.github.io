{{- define "main" }}

{{- $sem := site.Params.semanticsearch | default dict -}}
<div id="searchbox" class="searchbox searchbox--card"
    data-semantic-endpoint="{{ $sem.endpoint | default "" }}"
    data-semantic-timeout="{{ $sem.timeout | default 3000 }}">
    <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
        aria-label="search" type="search" autocomplete="off" maxlength="64">
    <div id="searchStatus" class="search-status" role="status" aria-live="polite" hidden>搜索中…</div>
    <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
</div>

{{- end }}{{/* end main */}}
