# 本仓（Hugo 源站，GitHub Pages = 权威源）→ CNB 镜像仓 t1mmoc/t1mmoc.cnb.cool，单向、1:1。
#
# 为什么是 1:1：源站 baseURL 已定 t1mmoc.github.io、评论走 giscus、正文引用全为根路径，
# 镜像站原样可用。镜像侧若靠 workflow 每次重放改写（改 baseURL / 去 giscus / 去前导
# 斜杠），迟早与源站漂移，还会静默覆盖镜像侧手改 —— 那是长期维护税，不是功能。
# 镜像仓已无自有文件（原 CloudBase 部署线 2026-10-09 移除），所以同步不需要保留任何东西。
#
# 两个必踩的坑，改这个 workflow 时别退回：
#   1) fetch-depth: 0 —— CNB 服务端开 receive.shallowUpdate，**默认拒绝浅仓 push**
#      （报 `shallow update not allowed`）。actions/checkout 默认只拉 1 层，必须显式关掉。
#   2) lfs: true —— 加密文章密文 static/cipher/*.bin 走 Git LFS；
#      不带它 checkout 只拿得到 pointer 文本，镜像仓的密文就废了。
#
# 前提（GitHub 仓 Settings → Secrets and variables → Actions）：
#   Secrets: CNB_TOKEN = CNB PAT（repo-code:rw，属 t1mmoc 组织）
#            CNB_REPO  = t1mmoc/t1mmoc.cnb.cool
name: Sync to CNB mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-cnb
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ⚠️ 必写：CNB 拒浅仓 push
          submodules: recursive
          lfs: true               # ⚠️ 必写：密文 *.bin 走 LFS

      - name: 主题内容化（镜像仓不解析 submodule）
        run: |
          set -euo pipefail
          # 镜像仓留 gitlink 会在 clone --recurse-submodules 时拉不到主题；改成普通目录。
          git rm -q --cached themes/PaperMod || true
          git add -f themes/PaperMod

      - name: Push to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          set -euo pipefail
          : "${CNB_REPO:?CNB_REPO secret missing}"
          : "${CNB_TOKEN:?CNB_TOKEN secret missing}"
          git config user.name  timmocagent
          git config user.email agent@tmoc.qzz.io
          git commit -m "sync: ${GITHUB_SHA::8} from github.com/${GITHUB_REPOSITORY}" || echo "no changes"
          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" HEAD:main
