# 本仓（Hugo 源站，GitHub Pages = 权威源）→ CNB 镜像仓 t1mmoc/t1mmoc.cnb.cool，单向、1:1。
#
# 为什么是 1:1：源站 baseURL 已定 t1mmoc.github.io、评论走 giscus、正文引用全为根路径，
# 镜像站原样可用。镜像侧若靠 workflow 每次重放改写（改 baseURL / 去 giscus / 去前导
# 斜杠），迟早与源站漂移，还会静默覆盖镜像侧手改 —— 那是长期维护税，不是功能。
# 镜像仓已无自有文件（原 CloudBase 部署线 2026-10-09 移除），所以同步不需要保留任何东西。
#
# 两个必踩的坑，改这个 workflow 时别退回：
#   1) fetch-depth: 0 —— CNB 服务端开 receive.shallowUpdate，**默认拒绝浅仓 push**
#      （报 `shallow update not allowed`）。actions/checkout 默认只拉 1 层，必须显式关掉。
#   2) lfs: true + `git lfs fetch origin --all` —— 加密文章密文 static/cipher/*.bin 走 Git LFS。
#      不带 lfs:true，checkout 只拿得到 pointer 文本；
#      但**只写 lfs:true 仍然不够**：actions/checkout 拉的是「最近引用」的 LFS 对象，
#      历史深处（旧版本 pointer）的对象拿不到，push 时 git-lfs 会报
#      `(missing) static/cipher/xxx.bin ... Uploading LFS objects: 0% (0/3)` 并拒绝整个 push。
#      所以 Push 之前必须单独跑一次全历史 LFS 取回。
#
# 前提（GitHub 仓 Settings → Secrets and variables → Actions）：
#   Secrets: CNB_TOKEN = CNB PAT（repo-code:rw，属 t1mmoc 组织）
#            CNB_REPO  = t1mmoc/t1mmoc.cnb.cool
name: Sync to CNB mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-cnb
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ⚠️ 必写：CNB 拒浅仓 push
          submodules: recursive
          lfs: true               # ⚠️ 必写：密文 *.bin 走 LFS

      - name: 主题内容化（镜像仓不解析 submodule）
        # 镜像仓留 gitlink 会在 clone --recurse-submodules 时拉不到主题，构建直接没有样式；
        # 改成普通目录（blob）入库。
        #
        # ⚠️ 老写法 `git rm --cached` + `git add -f` 是**空操作**：
        #   子模块目录里存在 .git，git 会再次把它识别成 embedded repo 并还原成 gitlink，
        #   暂存区里依然是 160000，推上去等于没改。要先把内层 .git 与 .gitmodules 去掉。
        run: |
          set -euo pipefail
          git rm -q -f --cached themes/PaperMod || true
          git rm -q -f --cached .gitmodules || true
          rm -rf .gitmodules themes/PaperMod/.git
          git add -f themes/PaperMod
          # 断言：必须是普通文件（100644）而不是 gitlink（160000），否则别推
          if git ls-files -s themes/PaperMod | grep -q '^160000'; then
            echo "::error::themes/PaperMod 仍是 gitlink（160000），主题内容化失败"
            exit 1
          fi
          echo "themes/PaperMod 已内容化：$(git ls-files themes/PaperMod | wc -l) 个文件"

      - name: 取回全历史 LFS 对象
        # 必须做：checkout 的 lfs:true 只取「最近引用」的 LFS 对象，历史深处的拿不到，
        # push 到 CNB 时 git-lfs 会以 (missing) 拒绝整个 push。
        # 源仓 t1mmoc.github.io 的 static/cipher/260711-1.bin 历史上换过两版内容
        # （848669 → 1019812 字节），旧那版正是藏在这里的对象。
        run: |
          set -euo pipefail
          git lfs fetch origin --all
          # 校验：当前工作区里每个 pointer 实体都已落到本地，否则宁可不推
          git lfs fsck --pointers

      - name: Push to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          set -euo pipefail
          : "${CNB_REPO:?CNB_REPO secret missing}"
          : "${CNB_TOKEN:?CNB_TOKEN secret missing}"
          git config user.name  timmocagent
          git config user.email agent@tmoc.qzz.io
          git commit -m "sync: ${GITHUB_SHA::8} from github.com/${GITHUB_REPOSITORY}" || echo "no changes"
          git push --force "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" HEAD:main
