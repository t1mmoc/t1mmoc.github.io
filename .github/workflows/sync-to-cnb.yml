# 把本仓（Hugo 源站，GitHub Pages = 权威源）单向同步到 CNB 镜像仓 t1mmoc/t1mmoc.cnb.cool
#
# 方向：GitHub（源）→ CNB（镜像）。CNB 侧不反向回推，避免回环。
# 机制：checkout → 应用镜像侧改写 → force push 到 CNB main。
#
# 为什么要「改写 + force push」而不是直接 push：
#   CNB 镜像不是 1:1 副本，镜像侧形态由本 flow 单方面决定，差异是固定的四类改写：
#     1) 主题 PaperMod 内联进仓（源站走 git submodule；CNB 侧拉不到子模块 → 必须去掉 gitlink）
#     2) baseURL 改指 CNB 站点（源站是 GitHub Pages 地址）
#     3) 去掉 giscus 评论配置与外链（镜像站不接 GitHub Discussions）
#     4) 站内引用去掉前导 `/`（含 /blog/ 子路径时绝对路径会 404）
#   每次同步都要重放，所以镜像侧历史不保留 → force push。
#
# 前提（GitHub 仓 Settings → Secrets and variables → Actions 已配置）：
#   Secrets:  CNB_TOKEN = CNB PAT（repo-code:rw，且**属于 t1mmoc 组织**）
#               ⚠️ 这个值最容易配错：无效/越权 token 在 CNB 侧的表现是
#                  `remote: Repository Not Found`，与「仓不存在」无从区分。
#                  本 flow 的 Preflight 步骤会把它变成明确报错。
#             CNB_REPO  = t1mmoc/t1mmoc.cnb.cool
#   Variables（可选）: CNB_SITE_BASEURL = 镜像站 baseURL，默认沿用仓库内的 CNB 地址
name: Sync to CNB mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-cnb
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 主题子模块内容要取回，再内联
          lfs: true               # 密文 static/cipher/*.bin 走 LFS

      - name: Inline theme (remove gitlink)
        run: |
          set -euo pipefail
          rm -f .gitmodules
          git rm --cached -r themes/PaperMod >/dev/null 2>&1 || true
          git add -f themes/PaperMod

      - name: Rewrite for CNB mirror
        env:
          CNB_SITE_BASEURL: ${{ vars.CNB_SITE_BASEURL }}
        run: |
          set -euo pipefail
          BASEURL="${CNB_SITE_BASEURL:-https://t1mmoc.cnb.cool/}"

          # 1) baseURL 指向镜像站
          sed -i "s#^baseURL = .*#baseURL = '${BASEURL}'#" hugo.toml

          # 2) 去掉 giscus 段落（[params.giscus] 到下一个顶层 [ 之前）
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("hugo.toml")
          s = p.read_text()
          # 删掉 [params.giscus] 整段
          s = re.sub(r"\n\s*#\s*Giscus[^\n]*\n(\s*#[^\n]*\n)*\s*\[params\.giscus\][\s\S]*?(?=\n\s*\[|\Z)", "\n", s)
          p.write_text(s)
          for f in ("layouts/_partials/comments.html",):
              q = pathlib.Path(f)
              if q.exists():
                  q.write_text("{{/* 评论区：本站为 CNB 镜像，不接 giscus；要接评论请贴自托管实例脚本 */}}\n")
          PY

          # 3) 站内绝对路径去前导 /（子路径下会 404）
          sed -i -E 's#(avatar|banner|favicon) = "/#\1 = "#' hugo.toml
          # 正文配图与静态资源同样去前导 /
          grep -rl '](/images/' content 2>/dev/null | xargs -r sed -i 's#](/images/#](images/#g' || true
          grep -rl 'src="/images/' content layouts 2>/dev/null | xargs -r sed -i 's#src="/images/#src="images/#g' || true

          echo "--- 改写后自检 ---"
          grep -n '^baseURL' hugo.toml
          ! grep -q 'giscus.app' layouts/_partials/comments.html

      # 先验凭据与目标仓，把「token 无效 / 仓写不进」这类问题变成一眼可读的报错。
      # 不验的话 git 只会甩一句 remote: Repository Not Found（CNB 对无权写入一律这样回，
      # 哪怕是公开仓），让人以为是仓不存在或路径写错。
      - name: Preflight (token + repo)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          set -euo pipefail
          : "${CNB_REPO:?CNB_REPO secret missing}"
          : "${CNB_TOKEN:?CNB_TOKEN secret missing}"

          api() { curl -sS -m 20 -H "Authorization: Bearer ${CNB_TOKEN}" -H "Accept: application/json" "$1"; }

          # 1) token 本身是不是 CNB 认的凭据
          who=$(api https://api.cnb.cool/user) || true
          if ! printf '%s' "$who" | grep -q '"username"'; then
            echo "::error::CNB_TOKEN 不是有效的 CNB 凭据（GET /user 未返回身份）。"
            echo "CNB 侧响应：$who"
            exit 1
          fi
          echo "token 身份：$(printf '%s' "$who" | python3 -c 'import json,sys;print(json.load(sys.stdin)["username"])')"

          # 2) token 对目标仓有没有【写】权限。
          # 注意：不用 git ls-remote —— 公开仓匿名也能读，坏 token 一样"通过"，验不出问题。
          # 用 push --dry-run 到一次性 ref：dry-run 不落地任何东西，但要走写权限校验。
          url="https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git"
          if ! out=$(GIT_TERMINAL_PROMPT=0 git push --dry-run "$url" HEAD:refs/heads/cnb-sync-preflight 2>&1); then
            echo "::error::CNB_TOKEN 对 ${CNB_REPO} 没有写权限（或仓路径写错）。"
            echo "$out" | sed 's/^/    /'
            echo "提示：CNB 对「无权写入」的仓一律回 'Repository Not Found'，"
            echo "哪怕是公开仓——所以别把这条读成「仓不存在」。"
            echo "排查顺序：① CNB_REPO 拼写 ② 该 token 是否属于 t1mmoc 组织、有无 repo-code:rw"
            echo "③ 该 token 是否已失效（GET /user 有身份 ≠ 对目标仓有权限）。"
            exit 1
          fi
          echo "写权限已确认：${CNB_REPO}"

      # 镜像仓有几样「只属于镜像侧」的东西，源仓没有：CNB 自己的流水线（.cnb.yml）、
      # 密钥模板、站点 README、镜像侧项目记忆。直接 git add -A + force push 会把它们删掉。
      # 做法：先把镜像侧这几个路径存下来，同步后再盖回去（同步=源站内容为准，但不动镜像侧资产）。
      - name: Snapshot mirror-owned files
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mirror-owned
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 \
            "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" /tmp/mirror-head
          # 这两个路径若不存在则跳过（用 tar 的 -C 与 || true 兜住）
          for path in .cnb .cnb.yml README.md; do
            if [ -e "/tmp/mirror-head/$path" ]; then
              cp -a "/tmp/mirror-head/$path" /tmp/mirror-owned/
            fi
          done
          ls -la /tmp/mirror-owned

      - name: Push to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
        run: |
          set -euo pipefail
          git config user.name  "timmocagent"
          git config user.email "agent@tmoc.qzz.io"

          # 盖回镜像侧自有文件
          for path in .cnb .cnb.yml README.md; do
            [ -e "/tmp/mirror-owned/$path" ] && cp -a "/tmp/mirror-owned/$path" .
          done

          git add -A
          git commit -m "sync: ${GITHUB_SHA::8} from github.com/${GITHUB_REPOSITORY}" || echo "no changes to commit"
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git"
          git push --force cnb HEAD:main
